services:
  chatchat:
    build:
      context: .
    image: langchain-chatchat:gitee-ai
    container_name: langchain-chatchat
    ports:
      - "8501:8501" # Web UI
      - "7861:7861" # REST API
    environment:
      GITEE_AI_API_KEY: ${GITEE_AI_API_KEY:?Set GITEE_AI_API_KEY in .env before starting}
      GITEE_AI_API_BASE_URL: ${GITEE_AI_API_BASE_URL:-https://ai.gitee.com/v1}
      GITEE_AI_CHAT_MODEL: ${GITEE_AI_CHAT_MODEL:-Qwen2.5-72B-Instruct}
      GITEE_AI_EMBEDDING_MODEL: ${GITEE_AI_EMBEDDING_MODEL:-bce-embedding-base_v1}
      TZ: Asia/Shanghai
    volumes:
      - ./data/knowledge_base:/app/knowledge_base
      - ./data/logs:/app/logs
    restart: unless-stopped
