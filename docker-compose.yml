services:
  langchain-chatchat:
    image: langchain-chatchat-gitee:0.2.9
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    environment:
      GITEE_AI_API_BASE_URL: ${GITEE_AI_API_BASE_URL:-https://ai.gitee.com/v1}
      GITEE_AI_API_KEY: ${GITEE_AI_API_KEY:?Set GITEE_AI_API_KEY in .env}
      GITEE_AI_CHAT_MODEL: ${GITEE_AI_CHAT_MODEL:-Qwen2-7B-Instruct}
      GITEE_AI_EMBEDDING_MODEL: ${GITEE_AI_EMBEDDING_MODEL:-Qwen3-Embedding-8B}
      GITEE_AI_RERANKER_MODEL: ${GITEE_AI_RERANKER_MODEL:-Qwen3-Reranker-8B}
    ports:
      - "8501:8501"
      - "7861:7861"
      - "20000:20000"
    volumes:
      - ./data/knowledge_base:/app/knowledge_base
      - ./data/logs:/app/logs
    restart: unless-stopped
